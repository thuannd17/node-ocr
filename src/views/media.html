<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media</title>
  <script src="/assets/i18n/vi.js"></script>
  <script src="/assets/i18n.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css">
  <style>
    .btn { background: var(--primary); color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
    .btn:hover:not(:disabled) { background: var(--primary-dark); }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
    .btn.secondary:hover:not(:disabled) { background: #eef4ff; }
    .btn.danger { background: #fff; color: #c62828; border: 1px solid #e5a3a3; }
    .btn.danger:hover:not(:disabled) { background: #fdecea; }
    .btn.danger.confirm, .btn.danger.confirm:hover:not(:disabled) { background: #c62828; color: #fff; border-color: #c62828; }
    .btn.danger:disabled { background: #fff; color: #bbb; border-color: #ddd; }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; }
    .conn { display: flex; gap: 8px; align-items: center; font-size: 13px; }
    .conn code { font-size: 12px; overflow-wrap: anywhere; }
    .conn { min-width: 0; flex-wrap: wrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; flex: none; }
    .dot.ok { background: #2e7d32; }
    .dot.bad { background: #c62828; }
    .toolbar .right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { font-size: 12px; border-radius: 12px; padding: 3px 10px; background: #eef1f5; color: #444; border: 1px solid transparent; cursor: pointer; }
    .chip.on { border-color: var(--primary); background: #e8f0fb; }
    .is-labeled { color: #2e7d32; }
    .is-unlabeled { color: #b26a00; }

    .msg { display: none; margin: 12px 0; padding: 10px 14px; border-radius: 6px; font-size: 14px; }
    .msg.visible { display: block; }
    .msg.ok { background: #e8f5e9; color: #1b5e20; }
    .msg.err { background: #fdecea; color: #b71c1c; }
    .msg.busy { background: #e3f2fd; color: #0d47a1; }

    .layout { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 16px; margin-top: 16px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .list-card { padding: 0; overflow: hidden; }
    .list-tools { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); }
    .list-tools input, .list-tools select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; min-width: 0; }
    .list-tools input { flex: 1; }
    .items { max-height: calc(100vh - 280px); min-height: 200px; overflow-y: auto; }
    .item { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #f0f1f4; cursor: pointer; font-size: 13px; }
    .item:hover { background: #f5f8fc; }
    .item.sel { background: #e8f0fb; }
    .item .ico { width: 18px; text-align: center; color: var(--muted); flex: none; }
    .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Consolas, monospace; font-size: 12px; }
    .item .st { flex: none; }
    .empty { padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }

    .viewer { padding: 16px; min-height: 300px; }
    .viewer-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .viewer-head h2 { margin: 0; font-size: 15px; font-family: Consolas, monospace; word-break: break-all; }
    .viewer-head .meta { font-size: 12px; color: var(--muted); }
    .viewer-head .acts { margin-left: auto; }
    .preview { border: 1px solid var(--border); border-radius: 6px; background: #fafbfc; overflow: auto; max-height: calc(100vh - 260px); }
    .preview img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    .preview iframe { display: block; width: 100%; height: calc(100vh - 280px); border: 0; background: #fff; }
  </style>
</head>
<body>
  <script src="/assets/nav.js"></script>
  <main class="page">
    <div class="page-header">
      <h1><i class="fa-solid fa-photo-film" aria-hidden="true"></i> Media</h1>
      <p class="subtitle" data-i18n>The roster files kept in MinIO. A deleted file goes to the trash in MinIO, so a wrong delete can be undone there.</p>
    </div>

    <div class="card toolbar">
      <div class="conn"><span class="dot" id="dot"></span> <span id="connText">Checking MinIO…</span></div>
      <div class="chips" id="chips"></div>
      <div class="right">
        <button class="btn danger" id="delUnlabeledBtn" disabled><i class="fa-solid fa-trash-can" aria-hidden="true"></i> <span id="delUnlabeledText">Delete all unlabeled</span></button>
        <button class="btn secondary" id="refreshBtn" title="Refresh"><i class="fa-solid fa-rotate" aria-hidden="true"></i></button>
      </div>
    </div>
    <div id="msg" class="msg"></div>

    <div class="layout">
      <div class="card list-card">
        <div class="list-tools">
          <input type="search" id="search" placeholder="Search by file name…" aria-label="Search by file name">
          <select id="kind" aria-label="File type">
            <option value="">All types</option>
            <option value="image">Images</option>
            <option value="pdf">PDF, CSV, Excel, TXT</option>
          </select>
        </div>
        <div class="items" id="items"><div class="empty">Loading…</div></div>
      </div>
      <div class="card viewer" id="viewer">
        <div class="empty">Choose a file on the left to preview it.</div>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    const fmtSize = (b) => (b == null ? '' : b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.round(b / 1024)} KB`);
    const badge = (i) => i.labeled
      ? `<span class="is-labeled"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> ${__('Labeled')}</span>`
      : `<span class="is-unlabeled"><i class="fa-regular fa-circle" aria-hidden="true"></i> ${__('Not labeled')}</span>`;
    let items = [], ok = false, selected = null, stateFilter = '', working = false;

    function showMsg(text, kind = 'ok') {
      const m = $('msg');
      m.className = `msg visible ${kind}`;
      m.textContent = text;
      if (kind === 'ok') setTimeout(() => { if (m.textContent === text) m.classList.remove('visible'); }, 6000);
    }
    const hideMsg = () => $('msg').classList.remove('visible');

    async function getJson(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    // A delete button asks once more on the button itself (no browser dialog): the second click within 5 s deletes.
    function armed(btn, confirmText, run) {
      btn.addEventListener('click', async () => {
        if (working || btn.disabled) return;
        if (!btn.classList.contains('confirm')) {
          btn.dataset.text = btn.querySelector('span').textContent;
          btn.classList.add('confirm');
          btn.querySelector('span').textContent = typeof confirmText === 'function' ? confirmText() : confirmText;
          clearTimeout(btn._t);
          btn._t = setTimeout(() => disarm(btn), 5000);
          return;
        }
        disarm(btn);
        await run();
      });
    }
    function disarm(btn) {
      clearTimeout(btn._t);
      if (!btn.classList.contains('confirm')) return;
      btn.classList.remove('confirm');
      btn.querySelector('span').textContent = btn.dataset.text;
    }

    async function loadStatus() {
      const status = await getJson('/api/media/status');
      const svc = status.service || {};
      ok = !!svc.ok;
      $('dot').className = 'dot ' + (ok ? 'ok' : 'bad');
      const store = svc.backend === 'minio'
        ? `MinIO <code>${escapeHtml(svc.endpoint)}</code> · ${__('bucket')} <code>${escapeHtml(svc.bucket)}</code>`
        : svc.backend === 'fs' ? `${__('folder')} <code>${escapeHtml(svc.dir)}</code>` : '';
      $('connText').innerHTML = ok ? store : `${store}: ${escapeHtml(__(svc.error || 'not reachable'))}`;
    }

    async function loadItems() {
      items = ok ? (await getJson('/api/media/items')).items : [];
      if (selected && !items.some(i => i.name === selected.name)) selected = null;
      render();
    }

    const kindOk = (i) => !$('kind').value || i.kind === $('kind').value;
    const stateOk = (i) => !stateFilter || (stateFilter === 'labeled') === i.labeled;

    function render() {
      const pool = items.filter(kindOk);
      const chip = (key, label, n) => `<span class="chip${stateFilter === key ? ' on' : ''}" data-state="${key}">${label} <b>${n}</b></span>`;
      $('chips').innerHTML = ok ? chip('', __('All'), pool.length)
        + chip('labeled', `<i class="fa-solid fa-circle-check is-labeled" aria-hidden="true"></i> ${__('Labeled')}`, pool.filter(i => i.labeled).length)
        + chip('unlabeled', `<i class="fa-regular fa-circle is-unlabeled" aria-hidden="true"></i> ${__('Not labeled')}`, pool.filter(i => !i.labeled).length) : '';

      const unlabeled = pool.filter(i => !i.labeled).length;
      disarm($('delUnlabeledBtn'));
      $('delUnlabeledBtn').disabled = !ok || !unlabeled || working;
      $('delUnlabeledText').textContent = __('Delete all unlabeled ({n})', { n: unlabeled });

      const q = $('search').value.trim().toLowerCase();
      const shown = pool.filter(i => stateOk(i) && (!q || i.name.toLowerCase().includes(q)));
      if (!ok) $('items').innerHTML = `<div class="empty">${__('The data store is not available.')}</div>`;
      else if (!shown.length) $('items').innerHTML = `<div class="empty">${items.length ? __('No file matches.') : __('No roster file yet.')}</div>`;
      else $('items').innerHTML = shown.map(i => `<div class="item${selected?.name === i.name ? ' sel' : ''}" data-name="${escapeHtml(i.name)}" title="${escapeHtml(i.name)}">
          <i class="ico fa-regular ${i.kind === 'image' ? 'fa-image' : i.ext === 'pdf' ? 'fa-file-pdf' : 'fa-file-lines'}" aria-hidden="true"></i>
          <span class="nm">${escapeHtml(i.name)}</span>
          <span class="st" title="${i.labeled ? __('Labeled') : __('Not labeled')}">${i.labeled
            ? '<i class="fa-solid fa-circle-check is-labeled" aria-hidden="true"></i>'
            : '<i class="fa-regular fa-circle is-unlabeled" aria-hidden="true"></i>'}</span>
        </div>`).join('');
      if (!selected) $('viewer').innerHTML = `<div class="empty">${__('Choose a file on the left to preview it.')}</div>`;
    }

    $('chips').addEventListener('click', (e) => {
      const c = e.target.closest('.chip[data-state]');
      if (!c) return;
      stateFilter = c.dataset.state;
      render();
    });
    $('search').addEventListener('input', render);
    $('kind').addEventListener('change', render);
    $('items').addEventListener('click', (e) => {
      const row = e.target.closest('.item');
      if (row) openItem(items.find(i => i.name === row.dataset.name));
    });

    function openItem(i) {
      if (!i) return;
      selected = i;
      document.querySelectorAll('.item').forEach(el => el.classList.toggle('sel', el.dataset.name === i.name));
      const src = `/api/media/file?name=${encodeURIComponent(i.name)}`;
      $('viewer').innerHTML = `<div class="viewer-head">
          <h2>${escapeHtml(i.name)}</h2>
          <span class="meta">${badge(i)} · ${fmtSize(i.size)}${i.lastModified ? ' · ' + __('changed {when}', { when: new Date(i.lastModified).toLocaleString() }) : ''}</span>
          <div class="acts"><button class="btn danger" id="delBtn"><i class="fa-solid fa-trash-can" aria-hidden="true"></i> <span>${__('Delete')}</span></button></div>
        </div>
        <div class="preview">${i.kind === 'image' ? `<img src="${src}" alt="${escapeHtml(i.name)}">` : `<iframe src="${src}" title="${escapeHtml(i.name)}"></iframe>`}</div>`;
      armed($('delBtn'), i.labeled ? __('Its label goes too. Click again') : __('Click again to delete'), () => deleteOne(i));
    }

    async function deleteOne(i) {
      working = true;
      try {
        await getJson(`/api/media/file?name=${encodeURIComponent(i.name)}`, { method: 'DELETE' });
        const at = items.indexOf(i);
        items.splice(at, 1);
        selected = null;
        working = false;
        render();
        showMsg(__('Deleted {name} (moved to the trash in MinIO).', { name: i.name }));
        // keep going down the list: open the next file the list shows
        const next = [...document.querySelectorAll('.item')].map(el => items.find(x => x.name === el.dataset.name))
          .find(x => items.indexOf(x) >= at);
        if (next) openItem(next);
      } catch (err) {
        showMsg(err.message, 'err');
      } finally {
        working = false;
      }
    }

    armed($('delUnlabeledBtn'), () => __('Click again to delete {n} files', { n: items.filter(i => kindOk(i) && !i.labeled).length }), async () => {
      working = true;
      $('delUnlabeledBtn').disabled = true;
      showMsg(__('Deleting the unlabeled files…'), 'busy');
      try {
        const r = await getJson('/api/media/delete-unlabeled', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: $('kind').value }),
        });
        if (r.failed.length) showMsg(__('{n} failed: {list}', { n: r.failed.length, list: r.failed.map(f => f.name).join(', ') }), 'err');
        else showMsg(__('Deleted {n} unlabeled files (moved to the trash in MinIO).', { n: r.deleted }));
      } catch (err) {
        showMsg(err.message, 'err');
      } finally {
        working = false;
        if (selected && !selected.labeled) selected = null;
        await refresh(false);
      }
    });

    async function refresh(clear = true) {
      if (clear) hideMsg();
      try {
        await loadStatus();
        await loadItems();
      } catch (err) {
        showMsg(err.message, 'err');
      }
    }
    $('refreshBtn').addEventListener('click', () => refresh());
    refresh().then(() => {
      const name = new URLSearchParams(location.search).get('name');
      if (name) openItem(items.find(i => i.name === name));
    });
  </script>
</body>
</html>
