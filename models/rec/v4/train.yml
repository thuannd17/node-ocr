# Training recipe of v4 ("tight"). retrain-check / kfold-recognition fill in
# ./models/rec/v4/checkpoint and ./exports/recognition-groundtruth/tight-all (and epoch_num) per run.
# Final model for the k-fold-validated recipe (exports/kfold/tight/results.json):
# det1920 stock-OCR crops + table-only replay + tight detector-box crops, all 75 images.
# val_list is an in-sample 1/40 sample (monitoring only) -> export --checkpoint=latest.
Global:
  debug: false
  use_gpu: true
  epoch_num: 15
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./models/rec/v4/checkpoint
  save_epoch_step: 10
  eval_batch_step: [0, 100]
  cal_metric_during_train: true
  pretrained_model: ./models/pretrained/en_PP-OCRv3_rec_train/best_accuracy
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: ./models/dict/en_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./models/rec/v4/checkpoint/predicts.txt


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.00005
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [1, 2]
    last_pool_type: avg
    last_pool_kernel_size: [2, 2]
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 64
            depth: 2
            hidden_dims: 120
            use_guide: True
          Head:
            fc_decay: 0.00001
      - SARHead:
          enc_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - SARLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: False

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./exports/recognition-groundtruth/tight-all
    ext_op_transform_idx: 1
    label_file_list:
    - ./exports/recognition-groundtruth/tight-all/train_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    # RecConAug disabled: it concatenates two crops' text labels with a bare
    # string `+=` (ppocr/data/imaug/rec_img_aug.py) — no space inserted
    # between them. Trained with it on, the model learned to drop spaces
    # between adjacent words/tokens ("17Jun20", "PUBLISHEDROSTER"), which
    # silently broke roster-parser.js's date regex (needs "17 Jun 20") and
    # made it extract 0 rows on almost every image (found 2026-09-21 when a
    # real benchmark run — not just eyeballing OCR text — caught it).
    # - RecConAug:
    #     prob: 0.5
    #     ext_data_num: 2
    #     image_shape: [48, 320, 3]
    #     max_text_length: *max_text_length
    - RecAug:
    - MultiLabelEncode:
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_sar
        - length
        - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 0
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./exports/recognition-groundtruth/tight-all
    label_file_list:
    - ./exports/recognition-groundtruth/tight-all/val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_sar
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 0
